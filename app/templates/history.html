<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benchmark History</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-4">
        <h1 class="text-center">Benchmark History</h1>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <div class="mt-3">
            <a href="/" class="btn btn-primary">New Benchmark</a>
        </div>

        {% if results %}
        <table class="table table-striped mt-4">
            <thead>
                <tr>
                    <th>Timestamp</th>
                    <th>Benchmark</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for r in results %}
                <tr>
                    <td>{{ r.timestamp }}</td>
                    <td>{{ r.title or r.benchmark }}</td>
                    <td>
                        <a href="/results/{{ r.id }}" class="btn btn-sm btn-outline-primary">View</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="text-muted text-center mt-4">No benchmark results yet. Run a benchmark to see history.</p>
        {% endif %}
    </div>
</body>
</html>
